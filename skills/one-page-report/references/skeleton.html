<!doctype html>
<!-- 一頁式報告起手式。整份複製後改內容，不要每次從空白開始重寫 CSS。
     這個檔案本身通過 scripts/check_page.py --print。 -->
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>報告標題</title>
<style>
:root{
  --bg:#F4F6F8; --card:#FFFFFF; --ink:#1B2430; --muted:#5B6675; --rule:rgba(27,36,48,.12);
  --accent:#2F5DA8; --accent-soft:rgba(47,93,168,.10);
  --good:#256B42;  --good-soft:rgba(37,107,66,.11);
  --warn:#9A5200;  --warn-soft:rgba(154,82,0,.12);
  --bad:#B42318;   --bad-soft:rgba(180,35,24,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151B; --card:#1A2029; --ink:#E6EAF0; --muted:#9AA5B4; --rule:rgba(230,234,240,.14);
    --accent:#7FA8F0; --accent-soft:rgba(127,168,240,.15);
    --good:#6CC58F;  --good-soft:rgba(108,197,143,.15);
    --warn:#F0A650;  --warn-soft:rgba(240,166,80,.16);
    --bad:#F2877D;   --bad-soft:rgba(242,135,125,.16);
  }
}
:root[data-theme="dark"]{
  --bg:#11151B; --card:#1A2029; --ink:#E6EAF0; --muted:#9AA5B4; --rule:rgba(230,234,240,.14);
  --accent:#7FA8F0; --accent-soft:rgba(127,168,240,.15);
  --good:#6CC58F;  --good-soft:rgba(108,197,143,.15);
  --warn:#F0A650;  --warn-soft:rgba(240,166,80,.16);
  --bad:#F2877D;   --bad-soft:rgba(242,135,125,.16);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Helvetica Neue","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  line-height:1.65;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.wrap{max-width:940px;margin:0 auto;padding:40px 22px 72px}
h1{font-size:1.75rem;margin:0 0 6px;letter-spacing:.01em}
h2{font-size:1.12rem;margin:34px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--rule)}
.meta{color:var(--muted);font-size:.86rem;margin:0 0 26px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:16px 18px;margin:0 0 14px;break-inside:avoid}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.chip{display:inline-block;font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:999px}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad {background:var(--bad-soft); color:var(--bad)}
.kpi .n{font-size:1.6rem;font-weight:700;line-height:1.1}
.kpi .lab{color:var(--muted);font-size:.8rem}
.scroll{overflow-x:auto}            /* 寬表格自己捲，頁面本體不左右捲 */
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.8rem}
.mode-switch{position:fixed;right:16px;bottom:16px;z-index:10;background:var(--card);color:var(--ink);
  border:1px solid var(--accent);border-radius:8px;padding:7px 12px;font:inherit;font-size:.78rem;
  font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.mode-switch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@page{size:A4 portrait;margin:12mm}
@media print{
  .mode-switch{display:none}
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .card{break-inside:avoid;box-shadow:none}
  h2{break-after:avoid}
}
</style></head><body>
<button type="button" class="mode-switch" id="mode-switch">切換深淺色</button>
<div class="wrap">

  <h1>結論寫在標題，不要寫主題</h1>
  <p class="meta">日期 · 資料口徑 · 誰要看這頁</p>

  <!-- 1 結論先行：第一屏就要能回答「所以呢」 -->
  <div class="grid">
    <div class="card kpi"><div class="n">0 / 13</div><div class="lab">通過的項目</div></div>
    <div class="card kpi"><div class="n">+2pp</div><div class="lab">最小可偵測效果</div></div>
  </div>

  <!-- 2 證據：數字旁邊寫出處與口徑 -->
  <h2>證據</h2>
  <div class="card scroll">
    <table>
      <thead><tr><th>項目</th><th>數字</th><th>出處／口徑</th><th>狀態</th></tr></thead>
      <tbody>
        <tr><td>—</td><td>—</td><td>—</td><td><span class="chip good">通過</span></td></tr>
        <tr><td>—</td><td>—</td><td>—</td><td><span class="chip bad">未達</span></td></tr>
      </tbody>
    </table>
  </div>

  <!-- 3 只在回報自己做的工作時放 -->
  <h2>我自己搞錯的</h2>
  <div class="card">過程中被推翻的判斷：錯在哪、怎麼發現的。</div>

  <!-- 4 沒有這段，讀的人不知道要回你什麼 -->
  <h2>還沒做完 · 需要拍板</h2>
  <div class="card"><span class="chip warn">待決定</span> 誰要決定什麼，卡在哪。</div>

</div>
<script>
/* 深淺色切換：沒選過就跟系統設定；選過就記住。儲存被封鎖（無痕、關閉網站資料）時仍可切換，只是不記住。 */
(function () {
  var STORE = 'opr-color-mode';
  var html = document.documentElement;
  var sw = document.getElementById('mode-switch');
  var sys = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

  function readPref() {
    try {
      var v = window.localStorage.getItem(STORE);
      return v === 'dark' || v === 'light' ? v : null;
    } catch (err) { return null; }
  }
  function writePref(v) {
    try { window.localStorage.setItem(STORE, v); } catch (err) { /* 只是不記住 */ }
  }
  function current() {
    return html.getAttribute('data-theme') || (sys && sys.matches ? 'dark' : 'light');
  }
  function show(mode) {
    html.style.colorScheme = mode;
    if (sw) sw.textContent = mode === 'dark' ? '改用淺色' : '改用深色';
  }

  var saved = readPref();
  if (saved) html.setAttribute('data-theme', saved);
  show(current());

  if (sys) {
    var follow = function () { if (!html.getAttribute('data-theme')) show(current()); };
    if (sys.addEventListener) sys.addEventListener('change', follow);
    else if (sys.addListener) sys.addListener(follow);
  }
  if (sw) sw.addEventListener('click', function () {
    var next = current() === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    show(next);
    writePref(next);
  });
})();
</script>
</body></html>
