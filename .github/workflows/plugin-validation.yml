name: plugin-validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin-validation:
    name: plugin-validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate shipped payload
        run: python3 scripts/validate_plugin.py .
      - name: Run validation contract tests
        run: python3 -m unittest tests/test_validate_plugin.py -v
